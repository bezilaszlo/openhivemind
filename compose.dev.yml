# Local development, layered explicitly on compose.yml by `pnpm dev:stack`
# (`docker compose -f compose.yml -f compose.dev.yml up --build --watch`), so a
# plain `docker compose up` still deploys the production shape.
#
# Production runs one container for both processes; development replaces it with a
# `backend` and a `viewer` service on the same dev image, so their logs, restarts
# and watch rules stay independent. Only Vite and Postgres are published. The
# rebuild rules cover every manifest: those change what the image installs, so they
# must rebuild rather than sync into a container holding stale node_modules.
#
# The watch sync paths are the actual runtime source trees, not whole package
# directories: backend/src (`tsx watch`'s import graph starts at src/server.ts and
# never reaches backend/test, drizzle.config.ts or tsup.config.ts, so those are not
# synced at all — nothing to restart or grow stale), plus frontend/src, index.html,
# public/ and vite.config.ts for the Vite dev server, plus shared/src for both. Test
# files (`**/*.test.ts(x)`) are excluded from every sync rule: they are never on
# either runtime's import graph, so copying them in only wastes a sync round trip.
# Migrations get their own sync+restart rule, excluded from the plain backend/src
# sync, so a schema change reruns the in-band migrate instead of restarting tsx into
# a database the new migration has not reached yet.

x-dev-image: &dev-image
  image: openhivemind-dev
  build:
    context: .
    target: dev
  restart: "no"

services:
  app: !reset null

  backend:
    <<: *dev-image
    # Migrate before watching, the way the runtime CMD does, so a fresh Postgres
    # volume comes up without a manual step.
    command:
      [
        "sh",
        "-c",
        "pnpm --filter @openhivemind/backend migrate && pnpm --filter @openhivemind/backend dev",
      ]
    environment:
      DATABASE_URL: postgres://openhivemind:${POSTGRES_PASSWORD:-development}@postgres:5432/openhivemind
      # The browser talks to Vite, so auth must trust that origin.
      APP_URL: http://localhost:5173
      AUTH_SECRET: ${AUTH_SECRET:-}
      SERVER_STATE_DIR: /data
    volumes:
      # Deliberately not the production app-state volume: this container runs as
      # root, and a root-owned secret would lock the runtime image out of it.
      - dev-state:/data
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        # Migrations are excluded here so only the sync+restart rule below handles them;
        # a plain sync would restart tsx into a database the new migration has not reached.
        - {
            action: sync,
            path: backend/src,
            target: /app/backend/src,
            ignore: [db/migrations/, "**/*.test.ts"],
          }
        - { action: sync, path: shared/src, target: /app/shared/src, ignore: ["**/*.test.ts"] }
        # A new migration has to rerun the in-band migrate, which the command does on restart.
        - {
            action: sync+restart,
            path: backend/src/db/migrations,
            target: /app/backend/src/db/migrations,
          }
        - { action: rebuild, path: pnpm-lock.yaml }
        - { action: rebuild, path: pnpm-workspace.yaml }
        - { action: rebuild, path: package.json }
        - { action: rebuild, path: shared/package.json }
        - { action: rebuild, path: backend/package.json }
        - { action: rebuild, path: frontend/package.json }
        - { action: rebuild, path: client/package.json }
        - { action: rebuild, path: tsconfig.json }
        - { action: rebuild, path: tsconfig.base.json }
        - { action: rebuild, path: Dockerfile }

  viewer:
    <<: *dev-image
    command: pnpm --filter @openhivemind/frontend dev
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_PROXY: http://backend:3000
    depends_on:
      - backend
    develop:
      watch:
        - {
            action: sync,
            path: frontend/src,
            target: /app/frontend/src,
            ignore: ["**/*.test.ts", "**/*.test.tsx"],
          }
        - { action: sync, path: frontend/public, target: /app/frontend/public }
        - { action: sync, path: frontend/index.html, target: /app/frontend/index.html }
        - { action: sync, path: frontend/vite.config.ts, target: /app/frontend/vite.config.ts }
        - { action: sync, path: shared/src, target: /app/shared/src, ignore: ["**/*.test.ts"] }
        - { action: rebuild, path: pnpm-lock.yaml }
        - { action: rebuild, path: pnpm-workspace.yaml }
        - { action: rebuild, path: package.json }
        - { action: rebuild, path: shared/package.json }
        - { action: rebuild, path: backend/package.json }
        - { action: rebuild, path: frontend/package.json }
        - { action: rebuild, path: client/package.json }
        - { action: rebuild, path: tsconfig.json }
        - { action: rebuild, path: tsconfig.base.json }
        - { action: rebuild, path: Dockerfile }

volumes:
  dev-state:
