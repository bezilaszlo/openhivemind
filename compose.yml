services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: openhivemind
      POSTGRES_USER: openhivemind
      POSTGRES_PASSWORD: development
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U openhivemind]
      interval: 2s
      timeout: 5s
      retries: 30
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgres://openhivemind:development@postgres:5432/openhivemind
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-}
      SERVER_STATE_DIR: /data
    volumes:
      - app-state:/data
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  app-state:
  postgres:
